<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popup_title">Release Notes - Image Viewer</title>
    <link id="icon" href="/icon/icon.png" type="img/x-icon" rel="Shortcut Icon" />
    <link rel="stylesheet" href="/page/popup.css" />
    <link rel="stylesheet" href="/page/theme.css" />
  </head>

  <body>
    <h1 id="title">Image Viewer <span data-i18n="release_notes">Release notes</span></h1>

    <fieldset class="theme-switch">
      <legend data-i18n="page_theme">Theme</legend>
      <label><input type="radio" name="page-theme" value="system" checked /> <span data-i18n="page_theme_system">System</span></label>
      <label><input type="radio" name="page-theme" value="light" /> <span data-i18n="page_theme_light">Light</span></label>
      <label><input type="radio" name="page-theme" value="dark" /> <span data-i18n="page_theme_dark">Dark</span></label>
    </fieldset>

    <nav>
      <div>
        <a href="https://github.com/hospotho/Image-Viewer">
          <img src="/icon/GitHub-Mark.png" alt="GitHub" style="width: 50px; height: 50px" />
          <span data-i18n="github_link">Github user manual</span>
        </a>
      </div>
      <div>
        <a href="https://ko-fi.com/tonymilktea">
          <img src="/icon/ko-fi.png" alt="Ko-fi" style="width: 50px; height: 50px" />
          <span data-i18n="kofi_link">Support me</span>
        </a>
      </div>
    </nav>
    <hr />

    <script type="text/javascript" src="/page/popup.js"></script>
    <script type="text/javascript" src="/page/theme.js"></script>
  </body>
</html>
